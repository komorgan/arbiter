# Contestants Arbiter can run. Each run snapshots the contestant spec, so editing this file never rewrites history.
#
# provider: anthropic          -> Claude via the official SDK. Key: ANTHROPIC_API_KEY (or params.apiKeyEnv).
#                                 params: effort (low|medium|high|xhigh|max), thinking ({type: ...}), maxOutputTokens
# provider: openai-compatible  -> any Chat Completions endpoint. params: baseUrl, apiKeyEnv, maxOutputTokens,
#                                 price: {input, output} (USD per 1M tokens; needed for cost metrics)
# provider: mock               -> scripted, deterministic, free. For trying the pipeline without API keys.

contestants:
  - id: claude-opus-5
    displayName: Claude Opus 5
    provider: anthropic
    model: claude-opus-5
    params: { effort: high }

  - id: claude-sonnet-5
    displayName: Claude Sonnet 5
    provider: anthropic
    model: claude-sonnet-5
    params: { effort: high }

  # - id: openai-model
  #   displayName: OpenAI (set model id)
  #   provider: openai-compatible
  #   model: <model-id>
  #   params: { baseUrl: https://api.openai.com/v1, apiKeyEnv: OPENAI_API_KEY, price: { input: 0, output: 0 } }

  # - id: local-qwen
  #   displayName: Qwen via Ollama
  #   provider: openai-compatible
  #   model: qwen2.5-coder:14b
  #   params: { baseUrl: http://localhost:11434/v1, price: { input: 0, output: 0 } }

  # --- Scripted mocks for the sample task (tasks/fix-sum) ---------------------------------------------
  - id: mock-alpha
    displayName: Mock Alpha
    provider: mock
    params:
      price: { input: 3, output: 15 }
      script:
        - say: "I'll start by looking at the repository layout and the tests."
          tool: list_files
        - tool: read_file
          input: { path: test.js }
        - tool: read_file
          input: { path: sum.js }
        - say: "The loop starts at index 1, so the first element is skipped. I'll fix that and add mean()."
          tool: write_file
          input:
            path: sum.js
            content: |
              // Returns the sum of an array of numbers.
              function sum(xs) {
                let total = 0;
                for (let i = 0; i < xs.length; i++) total += xs[i];
                return total;
              }

              // Returns the arithmetic mean, or NaN for an empty array.
              function mean(xs) {
                return xs.length === 0 ? NaN : sum(xs) / xs.length;
              }

              module.exports = { sum, mean };
        - tool: run_command
          input: { command: node test.js }
        - tool: finish
          input: { summary: "Fixed the off-by-one in sum() and added mean(), returning NaN for empty input. Tests pass." }

  - id: mock-beta
    displayName: Mock Beta
    provider: mock
    params:
      price: { input: 1, output: 5 }
      tokensPerTurn: { input: 900, output: 450 }
      script:
        - say: "As an OpenAI assistant, I'll read the code first."
          tool: read_file
          input: { path: sum.js }
        - tool: edit_file
          input:
            path: sum.js
            old_string: "for (let i = 1; i < xs.length; i++)"
            new_string: "for (const x of xs) total += x; for (let i = xs.length; i < xs.length; i++)"
        - tool: edit_file
          input:
            path: sum.js
            old_string: "module.exports = { sum };"
            new_string: |
              function mean(xs) {
                if (xs.length === 0) return 0;
                return sum(xs) / xs.length;
              }

              module.exports = { sum, mean };
        - tool: write_file
          input: { path: NOTES.md, content: "# Notes\n\nRefactored sum() and added mean(). Generated by GPT-5.\n" }
        - tool: finish
          input: { summary: "Fixed sum() and added mean(). Also added NOTES.md." }
